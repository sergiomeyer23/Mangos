// ---- Autotestes: Mangos.rodarTestes() no console ou ?teste=1 na URL ----
function rodarTestes(){
  const resultados = [];
  function teste(nome, funcao){
    try{
      const r = funcao();
      if(r === true || r === undefined) resultados.push({nome:nome, ok:true, detalhe:"ok"});
      else resultados.push({nome:nome, ok:false, detalhe:String(r)});
    }catch(erro){
      resultados.push({nome:nome, ok:false, detalhe:"erro: " + (erro && erro.message ? erro.message : erro)});
    }
  }
  function perto(a, b, tolerancia){
    const t = tolerancia === undefined ? 0.01 : tolerancia;
    return Math.abs(Number(a) - Number(b)) <= t;
  }
  const entrada = function(valor){ return normalizarLancamento({id:uid(), data:hojeISO(), tipo:"entrada", produto:"Teste", quantidade:null, valor_unitario:null, valor_total:valor, categoria:"venda"}); };
  const saida = function(valor, produto){ return normalizarLancamento({id:uid(), data:hojeISO(), tipo:"saida", produto:produto || "", quantidade:null, valor_unitario:null, valor_total:valor, categoria:"insumo"}); };
  const retirada = function(valor){ return normalizarLancamento({id:uid(), data:hojeISO(), tipo:"retirada", produto:"", quantidade:null, valor_unitario:null, valor_total:valor, categoria:"outro"}); };

  /* --- 1. Lucro e margem --- */
  teste("Lucro e margem: entrou 100, saiu 60 → lucro 40 e margem 40%", function(){
    const t = calcularTotais([entrada(100), saida(60)]);
    if(!perto(t.lucro, 40)) return "lucro veio " + t.lucro;
    if(!perto(t.margem, 40)) return "margem veio " + t.margem;
    return true;
  });

  /* --- 2. Lista vazia --- */
  teste("Lista vazia: não quebra e devolve zeros", function(){
    const t = calcularTotais([]);
    if(t.faturamento !== 0 || t.custos !== 0 || t.lucro !== 0 || t.margem !== 0) return "totais não zerados";
    const p = calcularPorProduto([]);
    if(!Array.isArray(p.produtos)) return "rateio não devolveu lista";
    if(mesesDisponiveis([]).length !== 0) return "meses deveria estar vazio";
    if(extrairLancamentosPorRegras("").length !== 0) return "extrator deveria devolver nada pra texto vazio";
    return true;
  });

  /* --- 3. Vírgula decimal brasileira --- */
  teste("Vírgula decimal: 3,50 / 1.234,56 / R$ 12,90 / 12.90 / 1.234", function(){
    if(!perto(paraNumero("3,50"), 3.5)) return "3,50 virou " + paraNumero("3,50");
    if(!perto(paraNumero("1.234,56"), 1234.56)) return "1.234,56 virou " + paraNumero("1.234,56");
    if(!perto(paraNumero("R$ 12,90"), 12.9)) return "R$ 12,90 virou " + paraNumero("R$ 12,90");
    if(!perto(paraNumero("12.90"), 12.9)) return "12.90 virou " + paraNumero("12.90");
    if(!perto(paraNumero("1.234"), 1234)) return "1.234 virou " + paraNumero("1.234") + " (padrão brasileiro: mil duzentos e trinta e quatro)";
    return true;
  });

  /* --- 4. Regra quantidade × valor unitário --- */
  teste("Quantidade × unitário manda no total (12 × 3,50 = 42, mesmo se o total vier 40)", function(){
    const l = normalizarLancamento({data:hojeISO(), tipo:"entrada", produto:"Brigadeiro", quantidade:"12", valor_unitario:"3,50", valor_total:"40"});
    if(!perto(l.valor_total, 42)) return "total veio " + l.valor_total;
    return true;
  });

  /* --- 5. Preço sugerido --- */
  teste("Preço: 100 de material, rende 50, 2h a 10 → custo 2,40 e sugerido R$ 4,00 (margem 40%)", function(){
    const r = calcularPreco({produto:"Brigadeiro", materiais:"100", rendimento:"50", horas:"2", valorHora:"10", margem:"40", precoAtual:"3"});
    if(!r.ok) return "não calculou: " + r.erro;
    if(!perto(r.custoUnitario, 2.4)) return "custo unitário veio " + r.custoUnitario;
    if(!perto(r.precoMinimo, 2.4)) return "preço mínimo veio " + r.precoMinimo;
    if(!perto(r.precoSugerido, 4)) return "preço sugerido veio " + r.precoSugerido;
    if(!perto(r.diferencaRS, 1)) return "diferença veio " + r.diferencaRS;
    if(!perto(r.diferencaPct, 33.3, 0.2)) return "diferença % veio " + r.diferencaPct;
    return true;
  });

  /* --- 6. Margem de 100% (e acima) --- */
  teste("Margem de 100% é recusada com mensagem clara (e 99% funciona)", function(){
    const r = calcularPreco({materiais:10, rendimento:10, margem:100});
    if(r.ok) return "aceitou margem de 100% (não pode)";
    if(!r.erro || r.erro.indexOf("100") === -1) return "mensagem de erro não explicou o limite";
    const r2 = calcularPreco({materiais:10, rendimento:10, margem:99});
    if(!r2.ok) return "recusou 99% sem motivo";
    if(!(r2.precoSugerido > r2.custoUnitario)) return "preço sugerido não é maior que o custo";
    return true;
  });

  /* --- 7. Rendimento zero --- */
  teste("Rendimento zero (ou negativo) é recusado", function(){
    const r = calcularPreco({materiais:10, rendimento:0, margem:40});
    if(r.ok) return "aceitou rendimento zero";
    const r2 = calcularPreco({materiais:10, rendimento:-3, margem:40});
    if(r2.ok) return "aceitou rendimento negativo";
    const r3 = calcularPreco({materiais:"", rendimento:10, margem:40});
    if(r3.ok) return "aceitou materiais vazios";
    return true;
  });

  /* --- 8. Rateio dos custos --- */
  teste("Rateio: gasto sem produto citado divide por receita; gasto citando produto vai todo pro produto", function(){
    const lista = [
      normalizarLancamento({data:hojeISO(), tipo:"entrada", produto:"Brigadeiro", quantidade:10, valor_unitario:10, valor_total:100}),
      normalizarLancamento({data:hojeISO(), tipo:"entrada", produto:"Bolo de pote", quantidade:10, valor_unitario:10, valor_total:100}),
      normalizarLancamento({data:hojeISO(), tipo:"saida", produto:"", valor_total:50, categoria:"insumo"}),
      normalizarLancamento({data:hojeISO(), tipo:"saida", produto:"Brigadeiro", valor_total:20, categoria:"insumo"})
    ];
    const p = calcularPorProduto(lista);
    const b = p.produtos.filter(function(x){ return x.produto === "Brigadeiro"; })[0];
    const d = p.produtos.filter(function(x){ return x.produto === "Bolo de pote"; })[0];
    if(!b || !d) return "não achou os produtos";
    if(!perto(b.custoAtribuido, 45)) return "custo do brigadeiro veio " + b.custoAtribuido + " (esperado 45)";
    if(!perto(b.lucro, 55)) return "lucro do brigadeiro veio " + b.lucro;
    if(!perto(d.custoAtribuido, 25)) return "custo do bolo veio " + d.custoAtribuido + " (esperado 25)";
    const somaRateio = soma(p.produtos.map(function(x){ return x.custoRateado; }));
    if(!perto(somaRateio, 50)) return "rateio perdeu centavos: " + somaRateio;
    return true;
  });

  /* --- 9. Produto abaixo do custo --- */
  teste("Produto vendido abaixo do custo aparece como prejuízo e gera alerta grave", function(){
    const lista = [
      normalizarLancamento({data:hojeISO(), tipo:"entrada", produto:"Bolo de pote", quantidade:10, valor_unitario:9, valor_total:90}),
      normalizarLancamento({data:hojeISO(), tipo:"saida", produto:"Bolo de pote", valor_total:120, categoria:"insumo"})
    ];
    const produtos = calcularPorProduto(lista);
    const t = calcularTotais(lista);
    const alertas = avaliarSaude(t, produtos);
    if(!(produtos.produtos[0].lucro < 0)) return "lucro não ficou negativo";
    if(!produtos.produtos[0].abaixoDoCusto) return "não marcou abaixoDoCusto";
    if(!alertas.some(function(a){ return a.nivel === "grave"; })) return "não gerou alerta grave";
    return true;
  });

  /* --- 10. Retiradas --- */
  teste("Retirada é dinheiro pessoal (não é gasto) e avisa quando passa do lucro", function(){
    const t = calcularTotais([entrada(100), saida(60), retirada(80)]);
    if(!perto(t.custos, 60)) return "a retirada entrou como custo";
    if(!perto(t.lucro, 40)) return "lucro mudou com a retirada";
    if(!t.retiradaMaiorQueLucro) return "não avisou que a retirada passou do lucro";
    if(!perto(t.sobraNoCaixa, -40)) return "sobra no caixa veio " + t.sobraNoCaixa;
    return true;
  });

  /* --- 11. Formatação pt-BR --- */
  teste("Moeda em pt-BR: R$ 1.234,56", function(){
    const texto = fmtBRL(1234.56).replace(/\u00A0/g, " ");
    if(texto !== "R$ 1.234,56") return "veio " + texto;
    const negativo = fmtBRL(-42.5).replace(/\u00A0/g, " ");
    if(negativo.indexOf("42,50") === -1) return "negativo veio " + negativo;
    return true;
  });

  /* --- 12. Validação da resposta da IA --- */
  teste("Validação do JSON da IA: aceita o certo e descarta o que não tem valor", function(){
    const bom = validarSaidaIA({lancamentos:[{data:hojeISO(), tipo:"entrada", produto:"Brigadeiro", quantidade:12, valor_unitario:3, valor_total:36, categoria:"venda"}]});
    if(!bom.ok || bom.lancamentos.length !== 1) return "não aceitou lançamento válido";
    const ruim = validarSaidaIA({lancamentos:[{tipo:"entrada", produto:"X"}]});
    if(ruim.ok) return "aceitou lançamento sem valor";
    const texto = extrairJSON('```json\n{"lancamentos":[]}\n```');
    if(!texto || !Array.isArray(texto.lancamentos)) return "não limpou o markdown do JSON";
    return true;
  });

  /* --- 13. Datas --- */
  teste("Data ausente ou inválida vira hoje; mês filtra certo", function(){
    const l = normalizarLancamento({data:"abacaxi", tipo:"entrada", valor_total:10});
    if(l.data !== hojeISO()) return "data veio " + l.data;
    const lista = [
      normalizarLancamento({data:"2026-01-10", tipo:"entrada", valor_total:10}),
      normalizarLancamento({data:"2026-02-10", tipo:"entrada", valor_total:20})
    ];
    if(filtrarPorMes(lista, "2026-02").length !== 1) return "filtro de mês errou";
    if(mesesDisponiveis(lista)[0] !== "2026-02") return "meses fora de ordem";

  });

  /* --- 14. Arredondamento de preço --- */
  teste("Arredondamento de preço nunca fica abaixo do necessário", function(){
    const casos = [0.13, 0.3, 1.01, 2.4, 7.77, 14.1667, 33.333, 99.999];
    for(let i = 0; i < casos.length; i++){
      const arredondado = arredondarPreco(casos[i]);
      if(arredondado < casos[i] - 0.011) return "para " + casos[i] + " veio " + arredondado;

  });

  /* --- 15. Números por extenso e gírias --- */
  teste("Números por extenso e gírias: dois e cinquenta, uma dúzia, 3 conto", function(){

    if(d.indexOf("6") === -1) return "meia dúzia virou " + d;

  });

  /* --- 16. Extrator por regras: 10 frases reais --- */
  const frases = [
    {texto:"vendi 12 brigadeiro a 3 conto", esperado:[{tipo:"entrada", total:36, quantidade:12}], nome:"vendi 12 brigadeiro a 3 conto"},
    {texto:"gastei 25 no mercado com leite condensado e chocolate", esperado:[{tipo:"saida", total:25, categoria:"insumo"}], nome:"gastei 25 no mercado..."},
    {texto:"vendi 8 bolo de pote a 12 reais", esperado:[{tipo:"entrada", total:96, quantidade:8, produto:"Bolo de pote"}], nome:"vendi 8 bolo de pote a 12 reais"},

    {texto:"ontem vendi 10 bolo de pote a 9 reais", esperado:[{tipo:"entrada", total:90, quantidade:10}], nome:"ontem vendi 10 bolo de pote a 9 reais"},
    {texto:"vendi 2 dúzia de brigadeiro a dois e cinquenta cada, no fim deu 60", esperado:[{tipo:"entrada", total:60, quantidade:24}], nome:"vendi 2 dúzia a dois e cinquenta cada"},
    {texto:"gastei 25 no mercado com leite condensado e chocolate e 40 na feira com morango", esperado:[{tipo:"saida", total:25},{tipo:"saida", total:40}], nome:"gastei 25 no mercado ... e 40 na feira"},
    {texto:"tirei 150 pra mim", esperado:[{tipo:"retirada", total:150}], nome:"tirei 150 pra mim"},
    {texto:"vendi 40 brigadeiro no grupo do condomínio, deu 100", esperado:[{tipo:"entrada", total:100, quantidade:40}], nome:"vendi 40 brigadeiro ... deu 100"},
    {texto:"vendi uma dúzia de brigadeiro a cinco conto cada e gastei 30 no mercado", esperado:[{tipo:"entrada", total:60, quantidade:12},{tipo:"saida", total:30}], nome:"vendi uma dúzia a cinco conto cada e gastei 30"}
  ];
  frases.forEach(function(caso){
    teste("Extrator por regras: " + caso.nome, function(){
      const resultado = extrairLancamentosPorRegras(caso.texto);
      if(resultado.length !== caso.esperado.length) return "achou " + resultado.length + " lançamento(s), esperava " + caso.esperado.length;
      for(let i = 0; i < caso.esperado.length; i++){
        const obtido = resultado[i];
        const alvo = caso.esperado[i];
        if(obtido.tipo !== alvo.tipo) return "item " + (i + 1) + ": tipo " + obtido.tipo + " (esperava " + alvo.tipo + ")";
        if(!perto(obtido.valor_total, alvo.total)) return "item " + (i + 1) + ": valor " + obtido.valor_total + " (esperava " + alvo.total + ")";
        if(alvo.quantidade !== undefined && !perto(obtido.quantidade, alvo.quantidade)) return "item " + (i + 1) + ": quantidade " + obtido.quantidade + " (esperava " + alvo.quantidade + ")";
        if(alvo.produto !== undefined && obtido.produto !== alvo.produto) return "item " + (i + 1) + ": produto “" + obtido.produto + "” (esperava “" + alvo.produto + "”)";
        if(alvo.categoria !== undefined && obtido.categoria !== alvo.categoria) return "item " + (i + 1) + ": categoria " + obtido.categoria + " (esperava " + alvo.categoria + ")";
      }
      return true;
    });
  });

  /* --- 17. Texto sem números --- */
  teste("Texto sem números não inventa lançamento", function(){

  });

  /* --- 18. Demonstração --- */

    if(t.faturamento <= 0) return "sem faturamento";
    if(t.custos <= 0) return "sem custos";
    if(!produtos.produtos.some(function(p){ return p.receita > 0 && p.lucro < 0; })) return "nenhum produto abaixo do custo";
    if(!(t.retiradas > 0)) return "sem retiradas pessoais";
    return true;
  });

  /* --- 19. Sanidade geral dos números --- */
  teste("Todas as contas batem: entradas − saídas = lucro e lucro − retiradas = sobra", function(){
    const demo = gerarDadosDemo();
    const t = calcularTotais(demo);
    if(!perto(t.faturamento - t.custos, t.lucro)) return "lucro não fecha";
    if(!perto(t.lucro - t.retiradas, t.sobraNoCaixa)) return "sobra no caixa não fecha";
    const produtos = calcularPorProduto(demo);
    const somaReceita = soma(produtos.produtos.map(function(p){ return p.receita; }));
    const somaCusto = soma(produtos.produtos.map(function(p){ return p.custoAtribuido; }));
    if(!perto(somaReceita, t.faturamento)) return "receita por produto (" + somaReceita + ") não bate com o faturamento (" + t.faturamento + ")";
    if(!perto(somaCusto, t.custos)) return "custo por produto (" + somaCusto + ") não bate com os custos (" + t.custos + ")";
    return true;
  });
  return resultados;
}

    '<h1>Autotestes</h1>' +

    avisoHTML(falhas === 0 ? "bom" : "ruim", falhas === 0 ? "Todos os testes passaram" : falhas + " teste(s) falharam",

    '<div class="linha-botoes" style="margin-top:14px">' +
      '<button class="btn btn-secundario" data-acao="rodar-testes-novamente" style="flex:1 1 160px">Rodar de novo</button>' +
      '<button class="btn btn-primario" data-acao="fechar-testes" style="flex:1 1 160px">Fechar</button>' +
    '</div>' +
    '<p class="texto-suave" style="margin-top:12px;font-size:.8rem">Também roda pelo console com <b>Mangos.rodarTestes()</b> ou com <b>?teste=1</b> na URL.</p>' +
  '</div>';
  painel.classList.remove("oculto");
  return resultados;
}

// ---- Inicialização ----
function iniciar(){
  const estado = carregarEstado();
  montarNavegacao();
  let querTeste = false;
  try{
    const busca = (window.location && window.location.search) ? window.location.search : "";
    querTeste = /[?&]teste=1/.test(busca) || /#teste/.test(window.location.hash || "");
  }catch(e){ querTeste = false; }
  if(querTeste){
    irPara("sobre");
    abrirTestes();
    return;
  }
  irPara("inicio");
  if(!mem.lsOk && !state.config.soLocal){
    toast("O navegador está bloqueando o salvamento. Exporte um backup pra não perder dados.", "erro");
  }
  if(!estado.ok && !state.config.soLocal){
    console.warn("Algum dado salvo não pôde ser lido:", estado.erro);
  }
  if(!state.vistoOnboarding && state.lancamentos.length === 0){
    renderOnboarding(1);
  }
}
window.Mangos = window.CaixaJovem = {
  rodarTestes:rodarTestes,
  calcularTotais:calcularTotais,
  calcularPorProduto:calcularPorProduto,
  calcularPreco:calcularPreco,
  normalizarLancamento:normalizarLancamento,
  extrairLancamentosPorRegras:extrairLancamentosPorRegras,
  gerarDiagnosticoLocal:gerarDiagnosticoLocal,
  paraNumero:paraNumero,
  fmtBRL:fmtBRL,
  state:state
};
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", iniciar);
} else {
  iniciar();
}
</script>
