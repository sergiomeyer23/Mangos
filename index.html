<title>Mangos — a IA do seu corre</title>
<meta name="description" content="Escreva suas vendas e gastos como fala. O Mangos organiza, calcula o lucro de cada produto e sugere o preço certo.">

<style>
:root{
  color-scheme:dark;

  --mangos-green:#C6FF00;
  --mangos-green-hover:#D4FF3D;
  --mangos-black:#0B0F0D;
  --mangos-gray:#6B6F72;
  --mangos-white:#F7F7F7;

  --bg-primary:#0B0F0D;
  --bg-secondary:#101411;
  --bg-card:#151A17;
  --bg-elevated:#181D1A;
  --surface:rgba(255,255,255,.035);
  --surface-hover:rgba(255,255,255,.055);

  --text-primary:#F7F7F7;
  --text-secondary:#A1A6A9;   /* #6B6F72 não passa AA em texto pequeno sobre o preto */
  --text-muted:#6B6F72;

  --border:rgba(247,247,247,.08);
  --border-strong:rgba(247,247,247,.14);

  --positivo:#C6FF00;
  --positivo-fundo:rgba(198,255,0,.08);
  --negativo:#FF7A6B;
  --negativo-fundo:rgba(255,122,107,.09);
  --atencao:#F2C94C;
  --atencao-fundo:rgba(242,201,76,.09);

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:20px;
  --shadow:0 10px 30px rgba(0,0,0,.25);
  --transition:250ms ease;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  font-size:15px;
  line-height:1.55;
  font-weight:400;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.oculto{display:none !important}
h1,h2,h3,h4{margin:0 0 .4rem;line-height:1.2;letter-spacing:-.02em;font-weight:600}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0 0 .8rem}
a{color:var(--mangos-green)}
small{font-size:.8rem}
b,strong{font-weight:600}
.texto-suave{color:var(--text-secondary)}
.num{font-variant-numeric:tabular-nums}
ul{margin:.2rem 0 .6rem;padding-left:1.15rem}
li{margin-bottom:.35rem}
:focus-visible{outline:2px solid var(--mangos-green);outline-offset:2px;border-radius:var(--radius-sm)}
::selection{background:rgba(198,255,0,.25)}

/* Estrutura */
.lateral{display:none}
.conteudo{max-width:960px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
@media (min-width:900px){
  .lateral{
    display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:248px;
    background:var(--bg-primary);border-right:1px solid rgba(247,247,247,.06);padding:24px 14px;overflow:auto;z-index:30;
  }
  .conteudo{margin-left:248px;max-width:920px;padding:32px 32px 64px}
  .rodape-nav{display:none !important}
}
.marca{display:flex;flex-direction:column;gap:4px;padding:0 10px 26px}
.marca .logo-completa{height:28px;width:127px}
.marca span{font-size:.74rem;color:var(--text-secondary)}
.nav-lateral{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-lateral button{
  display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;font:inherit;font-weight:500;font-size:.92rem;
  color:var(--text-muted);padding:11px 12px;border-radius:var(--radius-md);cursor:pointer;text-align:left;
  transition:color var(--transition),background var(--transition);
}
.nav-lateral button:hover{color:var(--text-primary);background:var(--surface)}
.nav-lateral button.ativo{color:var(--mangos-green);background:rgba(198,255,0,.08)}
.nav-lateral svg,.rodape-nav svg{width:20px;height:20px;flex:none}
.lateral-rodape{border-top:1px solid var(--border);padding:14px 10px 0;font-size:.74rem;color:var(--text-secondary)}

.topo-app{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.topo-app .titulos{display:flex;align-items:center;gap:12px;min-width:0}
.topo-app .logo-simbolo{height:30px;width:36px}
@media (min-width:900px){.topo-app .logo-simbolo{display:none}}
.topo-app .eyebrow{font-size:.76rem;font-weight:500;color:var(--text-secondary);margin:0}
.topo-app h1{margin:0}
.btn-icone{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);width:44px;height:44px;
  display:grid;place-items:center;cursor:pointer;color:var(--text-primary);flex:none;transition:border-color var(--transition);
}
.btn-icone:hover{border-color:var(--border-strong)}
@media (min-width:900px){.btn-icone{display:none}}

.rodape-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:rgba(11,15,13,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom));
}
.rodape-nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;cursor:pointer;
  font:inherit;font-size:.62rem;font-weight:500;color:var(--text-muted);padding:6px 0;min-height:52px;
  transition:color var(--transition);
}
.rodape-nav button.ativo{color:var(--mangos-green)}
.tela{animation:entrar .25s ease-out}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Cards */
.cartao{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;margin-bottom:14px;transition:border-color var(--transition),background var(--transition);
}
.cartao.tintado{background:linear-gradient(135deg,rgba(198,255,0,.07),rgba(198,255,0,0) 60%),var(--surface);border-color:rgba(198,255,0,.14)}
.cabecalho-cartao{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cabecalho-cartao h2,.cabecalho-cartao h3{margin:0}

.grade{display:grid;gap:12px}
.grade-2,.grade-3{grid-template-columns:1fr}
@media (min-width:600px){.grade-2{grid-template-columns:1fr 1fr}.grade-3{grid-template-columns:repeat(3,1fr)}}

.kpi{
  border-radius:var(--radius-lg);padding:18px;border:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color var(--transition),transform var(--transition);
}
.kpi:hover{border-color:rgba(198,255,0,.22);transform:translateY(-1px)}

function arredondar(valor, casas){

function uid(){

function pad2(n){ return String(n).padStart(2, "0"); }
/** Aceita "3", "3,5", "1.234,56", "R$ 12,90", "12.90", "1.234" (vírgula = decimal brasileira). */
function paraNumero(valor){
  if(valor === null || valor === undefined) return null;
  if(typeof valor === "number") return isFinite(valor) ? valor : null;
  let s = String(valor).trim();
  if(s === "") return null;
  s = s.replace(/[R$\s\u00A0]/gi, "").replace(/reais?$/i, "").trim();

  const temPonto = s.indexOf(".") !== -1;
  if(temVirgula && temPonto){
    s = s.replace(/\./g, "").replace(",", ".");      // "1.234,56" → 1234.56
  } else if(temVirgula){
    s = s.replace(",", ".");                         // "3,50" → 3.50

    const partes = s.split(".");
    if(partes.length > 2){

function fmtPct(valor){

function fmtDataBR(iso){

}
function nomeMes(mesISO){
  const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

/** Padroniza um lançamento vindo da IA, do extrator por regras ou do formulário. */

  }
  l.valor_total = arredondar(total === null ? 0 : total, 2);
  // Total digitado pelo usuário tem prioridade: o unitário é recalculado pra conta fechar.
  if(opcoes && opcoes.respeitarTotal){
    const totalDigitado = paraNumero(bruto && bruto.valor_total);
    if(totalDigitado !== null && totalDigitado > 0 && l.quantidade !== null && l.quantidade > 0 &&
       l.valor_unitario !== null && l.valor_unitario > 0){
      const produto = arredondar(l.quantidade * l.valor_unitario, 2);
      if(Math.abs(produto - totalDigitado) > 0.009){
        l.valor_unitario = arredondar(totalDigitado / l.quantidade);
        l.valor_total = arredondar(l.quantidade * l.valor_unitario, 2);
      }
    }
  }
  const cat = String((bruto && bruto.categoria) || "").toLowerCase();
  l.categoria = CATEGORIAS.some(function(c){ return c.valor === cat; }) ? cat
              : (l.tipo === "entrada" ? "venda" : "outro");
  if(l.tipo === "entrada") l.categoria = "venda";
  l.origem_texto = String((bruto && bruto.origem_texto) || "").slice(0, 300);
  l.revisar = !!(bruto && bruto.revisar);
  if(l.valor_total <= 0) l.revisar = true;

}
function validarLancamento(l){
  const erros = [];
  if(!l || typeof l !== "object") return {ok:false, erros:["Lançamento vazio."]};
  if(!isoValido(l.data)) erros.push("Data inválida.");
  if(["entrada","saida","retirada"].indexOf(l.tipo) === -1) erros.push("Tipo inválido (use entrada, saida ou retirada).");
  if(typeof l.valor_total !== "number" || !isFinite(l.valor_total)) erros.push("Valor total não é um número.");
  else if(l.valor_total < 0) erros.push("Valor total negativo.");
  else if(l.valor_total === 0) erros.push("Valor total zerado.");
  if(l.quantidade !== null && l.quantidade !== undefined && (typeof l.quantidade !== "number" || !isFinite(l.quantidade) || l.quantidade < 0))
    erros.push("Quantidade inválida.");
  if(l.valor_unitario !== null && l.valor_unitario !== undefined && (typeof l.valor_unitario !== "number" || !isFinite(l.valor_unitario) || l.valor_unitario < 0))
    erros.push("Valor unitário inválido.");
  return {ok:erros.length === 0, erros};
}
function calcularTotais(lancamentos){
  const t = {faturamento:0, custos:0, retiradas:0, lucro:0, margem:0, entradas:0, saidas:0,
             sobraNoCaixa:0, retiradaMaiorQueLucro:false, percentualRetirado:0, quantidadeLancamentos:0};
  (lancamentos || []).forEach(function(l){
    const v = Number(l.valor_total) || 0;
    t.quantidadeLancamentos++;
    if(l.tipo === "entrada"){ t.faturamento += v; t.entradas += v; }
    else if(l.tipo === "saida"){ t.custos += v; t.saidas += v; }
    else if(l.tipo === "retirada"){ t.retiradas += v; }
  });
  t.faturamento = arredondar(t.faturamento);
  t.custos = arredondar(t.custos);
  t.retiradas = arredondar(t.retiradas);
  t.entradas = t.faturamento;
  t.saidas = t.custos;
  t.lucro = arredondar(t.faturamento - t.custos);
  t.margem = t.faturamento > 0 ? arredondar((t.lucro / t.faturamento) * 100, 1) : 0;
  t.sobraNoCaixa = arredondar(t.lucro - t.retiradas);
  t.retiradaMaiorQueLucro = t.retiradas > t.lucro && t.retiradas > 0;
  t.percentualRetirado = t.lucro > 0 ? arredondar((t.retiradas / t.lucro) * 100, 0) : (t.retiradas > 0 ? 999 : 0);
  return t;
}
function filtrarPorMes(lancamentos, mesISO){
  if(!mesISO) return (lancamentos || []).slice();
  return (lancamentos || []).filter(function(l){ return mesDeDataISO(l.data) === mesISO; });
}
function mesesDisponiveis(lancamentos){
  const set = {};
  (lancamentos || []).forEach(function(l){ const m = mesDeDataISO(l.data); if(m) set[m] = true; });
  return Object.keys(set).sort().reverse();
}
/**
 * Lucro por produto.
 * Critério de rateio (também explicado na interface):
 *  - gasto que cita um produto   → custo inteiro daquele produto;
 *  - gasto sem produto citado    → dividido entre os produtos na proporção da receita de cada um.
 */
function calcularPorProduto(lancamentos){
  const mapa = {};
  const semProduto = {produto:SEM_PRODUTO, quantidade:0, receita:0, custoDireto:0, custoRateado:0,
                      custoAtribuido:0, lucro:0, margem:0, geradoPorRateio:true};
  let receitaComProduto = 0;
  let gastoGeral = 0;

  function linha(nomeOriginal){
    const chave = chaveProduto(nomeOriginal);
    if(chave === "") return semProduto;
    if(!mapa[chave]){
      mapa[chave] = {produto:capitalizar(nomeOriginal), quantidade:0, receita:0, custoDireto:0,
                     custoRateado:0, custoAtribuido:0, lucro:0, margem:0, geradoPorRateio:false};
    }
    return mapa[chave];
  }

  (lancamentos || []).forEach(function(l){
    const v = Number(l.valor_total) || 0;
    if(l.tipo === "entrada"){
      const p = linha(l.produto);
      p.receita += v;
      const q = (typeof l.quantidade === "number" && l.quantidade > 0) ? l.quantidade : null;
      if(q !== null) p.quantidade += q;
      if(p !== semProduto) receitaComProduto += v;
    } else if(l.tipo === "saida"){
      const p = linha(l.produto);
      if(p === semProduto) gastoGeral += v;
      else p.custoDireto += v;
    }
  });

  const nomes = Object.keys(mapa);
  let rateioAplicado = false;
  if(gastoGeral > 0){
    if(nomes.length === 0){
      semProduto.custoRateado += gastoGeral;   // sem venda com produto, o gasto fica no geral
      rateioAplicado = true;
    } else {
      const comReceita = nomes.filter(function(n){ return mapa[n].receita > 0; });
      if(comReceita.length === 0){
        const parte = arredondar(gastoGeral / nomes.length);
        nomes.forEach(function(n){ mapa[n].custoRateado += parte; });
        const diferenca = arredondar(gastoGeral - parte * nomes.length);
        if(diferenca !== 0) mapa[nomes[0]].custoRateado = arredondar(mapa[nomes[0]].custoRateado + diferenca);
      } else if(comReceita.length === 1){
        mapa[comReceita[0]].custoRateado += gastoGeral;
      } else {
        let acumulado = 0;
        comReceita.forEach(function(n, i){
          const p = mapa[n];
          let parte;
          if(i === comReceita.length - 1) parte = arredondar(gastoGeral - acumulado);
          else { parte = arredondar(gastoGeral * (p.receita / receitaComProduto)); acumulado = arredondar(acumulado + parte); }
          p.custoRateado += parte;
        });
      }
      rateioAplicado = true;
    }
  }

  const lista = nomes.map(function(n){ return mapa[n]; });
  lista.push(semProduto);

  lista.forEach(function(p){
    p.receita = arredondar(p.receita);
    p.custoDireto = arredondar(p.custoDireto);
    p.custoRateado = arredondar(p.custoRateado);
    p.custoAtribuido = arredondar(p.custoDireto + p.custoRateado);
    p.lucro = arredondar(p.receita - p.custoAtribuido);
    p.margem = p.receita > 0 ? arredondar((p.lucro / p.receita) * 100, 1) : (p.custoAtribuido > 0 ? -100 : 0);
    p.abaixoDoCusto = p.receita > 0 && p.lucro < 0;
    p.quantidade = arredondar(p.quantidade, 3);
  });
  lista.sort(function(a, b){
    if(b.receita !== a.receita) return b.receita - a.receita;
    return b.lucro - a.lucro;
  });
  return {produtos:lista, gastoGeral:arredondar(gastoGeral), rateioAplicado:rateioAplicado,
          receitaComProduto:arredondar(receitaComProduto)};
}
/** Arredonda pra cima até ,00 ou ,50, sem nunca ficar abaixo do preço calculado. */
function arredondarPreco(valor){
  const v = Number(valor);
  if(!isFinite(v) || v <= 0) return 0;
  if(v < 1) return arredondar(Math.ceil(v * 20 - 1e-9) / 20, 2);   // abaixo de R$ 1, sobe de 5 em 5 centavos
  const dobro = v * 2;
  if(dobro - Math.floor(dobro) < 0.01) return arredondar(v, 2);     // já termina em ,00 ou ,50
  return arredondar(Math.ceil(dobro - 1e-9) / 2, 2);
}
function calcularPreco(entrada){
  const e = entrada || {};
  const materiais = paraNumero(e.materiais);
  const horas = paraNumero(e.horas) !== null ? paraNumero(e.horas) : 0;
  const valorHora = paraNumero(e.valorHora) !== null ? paraNumero(e.valorHora) : 0;
  const rendimentoBruto = paraNumero(e.rendimento);
  const rendimento = rendimentoBruto === null ? NaN : Math.trunc(rendimentoBruto);
  const margem = paraNumero(e.margem);
  const precoAtual = (e.precoAtual === "" || e.precoAtual === null || e.precoAtual === undefined) ? null : paraNumero(e.precoAtual);

  if(materiais === null || materiais < 0) return {ok:false, erro:"Informe quanto você gastou de materiais na receita (pode usar vírgula: 25,50)."};
  if(!isFinite(rendimento) || rendimento <= 0) return {ok:false, erro:"O rendimento precisa ser 1 unidade ou mais. Quantas unidades a sua receita dá?"};
  if(horas < 0 || valorHora < 0) return {ok:false, erro:"Horas e valor da hora não podem ser negativos."};
  if(margem === null || !isFinite(margem) || margem < 0) return {ok:false, erro:"Informe a margem desejada em % (ex.: 40)."};
  if(margem >= 100) return {ok:false, erro:"A margem precisa ser menor que 100%. Com 100% a conta do preço não existe. Tente algo entre 20% e 70%."};
  if(precoAtual !== null && (!isFinite(precoAtual) || precoAtual < 0)) return {ok:false, erro:"O preço que você cobra hoje precisa ser um número (ou deixe vazio)."};

  const custoMaoDeObra = arredondar(horas * valorHora);
  const custoProducao = arredondar(materiais + custoMaoDeObra);
  const custoUnitarioExato = custoProducao / rendimento;
  const custoUnitario = arredondar(custoUnitarioExato);
  const precoMinimo = custoUnitario;
  const precoSugeridoExato = custoUnitarioExato / (1 - margem / 100);   // margem sobre o preço, não markup
  const precoSugerido = arredondarPreco(precoSugeridoExato);
  const lucroPorUnidade = arredondar(precoSugerido - custoUnitario);
  const margemReal = precoSugerido > 0 ? arredondar((lucroPorUnidade / precoSugerido) * 100, 1) : 0;
  const resultado = {
    ok:true,
    produto: String(e.produto || "seu produto").trim() || "seu produto",
    materiais: arredondar(materiais), horas:arredondar(horas,2), valorHora:arredondar(valorHora),
    custoMaoDeObra, custoProducao, rendimento, custoUnitario, custoUnitarioExato,
    precoMinimo, precoSugerido, precoSugeridoExato, margemDesejada:arredondar(margem,2),
    lucroPorUnidade, margemReal, precoAtual:precoAtual,
    diferencaRS:null, diferencaPct:null, precoAtualAbaixoDoCusto:false, precoAtualReprovado:false, passos:[]
  };
  if(precoAtual !== null){
    resultado.diferencaRS = arredondar(precoSugerido - precoAtual);
    resultado.diferencaPct = precoAtual > 0 ? arredondar(((precoSugerido - precoAtual) / precoAtual) * 100, 1) : null;
    resultado.precoAtualAbaixoDoCusto = precoAtual < custoUnitario;
    resultado.precoAtualReprovado = precoAtual < precoSugerido;
  }
  const p = resultado.passos;
  const nome = resultado.produto;
  p.push("Você gasta " + fmtBRL(materiais) + " de materiais pra fazer a receita toda.");
  if(horas > 0 && valorHora > 0){
    p.push("Seu tempo vale " + fmtBRL(valorHora) + " por hora: " + fmtQtd(horas) + " h × " + fmtBRL(valorHora) + " = " + fmtBRL(custoMaoDeObra) + " de mão de obra.");
    p.push("Custo total da receita: " + fmtBRL(materiais) + " + " + fmtBRL(custoMaoDeObra) + " = " + fmtBRL(custoProducao) + ".");
  } else {
    p.push("Nesse cálculo não entrou o seu tempo (você deixou 0 hora). Vale colocar seu tempo: trabalho também é custo.");
    p.push("Custo total da receita: " + fmtBRL(custoProducao) + ".");
  }
  p.push("A receita rende " + fmtQtd(rendimento) + (rendimento === 1 ? " unidade" : " unidades") + ", então cada " +
         nome.toLowerCase() + " te custa " + fmtBRL(custoProducao) + " ÷ " + fmtQtd(rendimento) + " = " + fmtBRL(custoUnitario) + ".");
  p.push("Esse é o seu preço mínimo: abaixo de " + fmtBRL(custoUnitario) + " você está pagando pra vender.");
  p.push("Com " + fmtPct(margem) + " de margem, o preço é " + fmtBRL(custoUnitario) + " ÷ (1 − " +
         fmtPct(margem).replace("%","") + "/100) = " + fmtBRL(arredondar(precoSugeridoExato)) + "; arredondando pra um número redondo: " + fmtBRL(precoSugerido) + ".");
  p.push("Nesse preço sobram " + fmtBRL(lucroPorUnidade) + " por unidade (margem real de " + fmtPct(margemReal) + ").");
  if(precoAtual !== null){
    if(precoAtual === 0){
      p.push("Hoje você cobra de graça (R$ 0,00): qualquer preço acima de " + fmtBRL(custoUnitario) + " já é melhor.");
    } else if(resultado.diferencaRS > 0){
      p.push("Hoje você cobra " + fmtBRL(precoAtual) + ": está " + fmtBRL(resultado.diferencaRS) + " abaixo do sugerido (" +
             fmtPct(resultado.diferencaPct) + "). Ajustando, sobram " + fmtBRL(arredondar(precoSugerido - precoAtual)) + " a mais por unidade.");
    } else if(resultado.diferencaRS < 0){
      p.push("Hoje você cobra " + fmtBRL(precoAtual) + ", que já é " + fmtBRL(Math.abs(resultado.diferencaRS)) + " acima do sugerido (" +
             fmtPct(Math.abs(resultado.diferencaPct)) + "). Confira se o cliente continua comprando.");
    } else {
      p.push("Hoje você cobra exatamente o preço sugerido.");
    }
    if(resultado.precoAtualAbaixoDoCusto) p.push("Atenção: o seu preço atual (" + fmtBRL(precoAtual) + ") está abaixo do custo (" + fmtBRL(custoUnitario) + "). Cada venda sua está tirando dinheiro do seu bolso.");
  }
  return resultado;
}
/** Alertas de saúde do negócio, usados em Meu Caixa. */
function avaliarSaude(totais, produtos){
  const alertas = [];
  const lista = (produtos && produtos.produtos) ? produtos.produtos : [];
  const negativos = lista.filter(function(p){ return p.receita > 0 && p.lucro < 0; });
  const magros = lista.filter(function(p){ return p.receita > 0 && p.lucro >= 0 && p.margem < 15; });
  const positivos = lista.filter(function(p){ return p.receita > 0 && p.lucro > 0; });
  if(negativos.length){
    negativos.forEach(function(p){
      alertas.push({nivel:"grave", titulo:"Prejuízo em " + p.produto,
        texto:"Receita de " + fmtBRL(p.receita) + " e custo de " + fmtBRL(p.custoAtribuido) + ": prejuízo de " + fmtBRL(Math.abs(p.lucro)) + " no mês (margem de " + fmtPct(p.margem) + "). Suba o preço ou reduza o custo."});
    });
  }
  magros.forEach(function(p){
    alertas.push({nivel:"atencao", titulo:"Margem apertada em " + p.produto,
      texto:"Sobram " + fmtBRL(p.lucro) + " nesse produto (margem de " + fmtPct(p.margem) + "). Qualquer gasto extra zera o lucro."});
  });
  if(totais.faturamento === 0 && totais.custos > 0){
    alertas.push({nivel:"grave", titulo:"Só gastos, nenhuma venda no período",
      texto:fmtBRL(totais.custos) + " de custos e nenhuma venda registrada."});
  }
  if(totais.retiradaMaiorQueLucro){
    alertas.push({nivel:"grave", titulo:"Você tirou mais do que lucrou",
      texto:"Você retirou " + fmtBRL(totais.retiradas) + " e o lucro foi " + fmtBRL(totais.lucro) + ". Os " + fmtBRL(Math.abs(totais.lucro - totais.retiradas)) + " de diferença saíram do dinheiro do negócio e precisam voltar pra comprar material."});
  } else if(totais.retiradas > 0 && totais.lucro > 0 && totais.percentualRetirado >= 80){
    alertas.push({nivel:"atencao", titulo:"Você retirou quase todo o lucro",
      texto:"As retiradas somam " + fmtBRL(totais.retiradas) + ", " + fmtPct(totais.percentualRetirado) + " do lucro. Ficaram " + fmtBRL(totais.sobraNoCaixa) + " no negócio pra repor material."});
  }
  if(totais.faturamento > 0 && totais.margem < 15){
    alertas.push({nivel:"atencao", titulo:"Margem geral baixa",
      texto:"De cada R$ 100 vendidos, sobram " + fmtBRL(arredondar(totais.margem)) + ". Com margem assim, qualquer imprevisto vira prejuízo."});
  }
  if(totais.faturamento === 0 && totais.custos === 0 && totais.quantidadeLancamentos === 0){
    alertas.push({nivel:"info", titulo:"Ainda sem lançamentos neste período",
      texto:"Escreva suas vendas e gastos em Registrar."});
  }
  if(negativos.length === 0 && magros.length === 0 && positivos.length > 0){
    const melhor = positivos.slice().sort(function(a,b){ return b.margem - a.margem; })[0];
    alertas.push({nivel:"bom", titulo:"Nenhum produto no prejuízo",
      texto:"Todos os produtos vendidos deram lucro. O mais rentável é " + melhor.produto + ", com margem de " + fmtPct(melhor.margem) + "."});
  }
  return alertas;
}

  const positivos = comVenda.filter(function(p){ return p.lucro > 0; });

  }

  }

    problemas.push({titulo:"Nenhuma retirada registrada",

  }
  const reservasProblema = [
    {titulo:"Anote por duas semanas antes de decidir", explicacao:"Com poucos lançamentos o diagnóstico fica no chute. Anote tudo por 14 dias e volte aqui: aí os números mostram o caminho."},
    {titulo:"Os gastos pequenos também são custo", explicacao:"Embalagem, gás, passagem e etiqueta saem do seu lucro. Se eles não entram na conta, o lucro parece maior do que realmente é."},
    {titulo:"Misturar o dinheiro pessoal com o do negócio esconde o prejuízo", explicacao:"Quando tudo sai da mesma conta, você não sabe se o que sobrou é lucro ou é dinheiro que já estava lá. Separe uma parte só para o negócio."}
  ];
  for(let i = 0; i < reservasProblema.length && problemas.length < 3; i++){
    problemas.push(reservasProblema[i]);
  }

  const acoes = [];
  if(negativos.length){
    const p = negativos[0];
    const custoPorUnidade = (p.quantidade > 0) ? (p.custoAtribuido / p.quantidade) : p.custoDireto;
    const precoNecessario = custoPorUnidade > 0 ? arredondarPreco(custoPorUnidade / (1 - 0.3)) : p.custoAtribuido;
    acoes.push("Suba o preço de " + p.produto + " pra pelo menos " + fmtBRL(precoNecessario) + ". O custo dele hoje passa do que ele traz.");
  }
  if(t.retiradas > 0) acoes.push("Defina hoje um valor fixo de retirada por semana (ex.: " + fmtBRL(arredondar(t.retiradas / 4)) + ") e anote como retirada, não como gasto.");
  else acoes.push("Escolha um valor fixo pra tirar por semana e registre como retirada. Isso não é gasto do negócio.");
  acoes.push("Anote todos os gastos da próxima semana, até os de R$ 2, pro lucro ficar exato.");
  if(comVenda.length > 1) acoes.push("Faça uma promoção combinada com o seu produto mais lucrativo (" + melhor.produto + "), levando o cliente a comprar mais dele.");
  else acoes.push("Teste vender em 2 lugares novos esta semana (vizinhos, grupo do prédio, colegas) e anote o que funcionou.");
  if(comVenda.length) acoes.push("Confira o custo real de " + comVenda[0].produto + " na aba Preço Certo e ajuste o preço se estiver abaixo do sugerido.");
  const reservasAcao = [
    "Anote os gastos pequenos (embalagem, gás, passagem) por 7 dias seguidos: eles aparecem no seu lucro mais do que parece.",
    "Separe uma carteira ou conta só pro dinheiro do negócio e registre cada retirada.",
    "Registre as vendas do dia antes de dormir pra não esquecer valores."
  ];
  for(let i = 0; i < reservasAcao.length && acoes.length < 3; i++){
    acoes.push(reservasAcao[i]);
  }

  let conceito;
  if(t.retiradaMaiorQueLucro || (t.lucro > 0 && t.retiradas === 0)){
    conceito = {termo:"Separar o dinheiro pessoal do negócio",
      explicacao:"O dinheiro do negócio compra material e mantém as vendas girando; o seu é o que você tira como pagamento pelo trabalho. Com os dois juntos, parece lucro o que era dinheiro da produção."};
  } else if(t.faturamento > 0 && t.margem < 20){
    conceito = {termo:"Margem",
      explicacao:"Margem é quanto sobra de cada R$ 100 vendidos depois de pagar os custos. Margem de 20% quer dizer R$ 20 com você e R$ 80 de custo."};
  } else if(comVenda.length >= 2){
    conceito = {termo:"Capital de giro",
      explicacao:"Capital de giro é o dinheiro que fica no negócio pra comprar o material do próximo lote antes de você receber as vendas. Sem ele, você vende bem num dia e não tem dinheiro pra produzir no dia seguinte."};
  } else {
    conceito = {termo:"Reserva",
      explicacao:"Reserva é uma parte do lucro guardada pra imprevistos, como quebrar o celular que você usa pra vender ou o preço do insumo subir. Guardar pouco, toda semana, é melhor do que não guardar nada."};
  }
  return {
    fonte:"regras do app",
    parabens:parabens,
    problemas:problemas.slice(0, 3),
    acoes:acoes.slice(0, 3),
    conceito:conceito
  };
}

        if(Array.isArray(obj.lancamentos)) state.lancamentos = obj.lancamentos.map(normalizarLancamento).filter(function(l){ return l.valor_total > 0; });

        state.dadosDemo = obj.dadosDemo === true;

        if(isoValido(obj.ultimoMes + "-01")) state.mesCaixa = obj.ultimoMes;
      }
    }
  }catch(e){ tudo.ok = false; tudo.erro = "dados salvos corrompidos ou bloqueados"; }
  try{
    const cfg = localStorage.getItem(STORAGE.config);
    if(cfg){
      const c = JSON.parse(cfg);
      if(c && typeof c === "object"){
        state.config.usarIA = c.usarIA !== false;
        state.config.nomeUsuario = typeof c.nomeUsuario === "string" ? c.nomeUsuario.slice(0, 40) : "";
      }
    }
  }catch(e){ tudo.ok = false; tudo.erro = "configurações ilegíveis"; }
  try{
    const chave = localStorage.getItem(STORAGE.chave);
    if(chave && typeof chave === "string") state.config.chave = chave.trim();
  }catch(e){ tudo.ok = false; tudo.erro = "chave não pôde ser lida"; }
  mem.lsOk = storageDisponivel();
  if(!mem.lsOk) tudo.ok = false;
  return tudo;
}

function montarUrl(modelo){
  return GEMINI_API_BASE + "/" + encodeURIComponent(modelo) + ":generateContent";
}
async function chamarGemini(opcoes){
  const o = opcoes || {};
  if(!temChave()) throw new Error("SEM_CHAVE");
  const corpo = {
    contents:[{role:"user", parts:[{text:o.prompt}]}],
    generationConfig:{
      temperature:(o.temperatura === undefined ? 0.2 : o.temperatura),
      topP:0.9,
      maxOutputTokens:o.maxTokens || 2048
    }
  };
  if(o.instrucao) corpo.systemInstruction = {parts:[{text:o.instrucao}]};
  if(o.json) corpo.generationConfig.responseMimeType = "application/json";
  const controlador = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const timer = controlador ? setTimeout(function(){ controlador.abort(); }, 45000) : null;
  let resposta;
  try{
    resposta = await fetch(montarUrl(o.modelo || GEMINI_MODEL) + "?key=" + encodeURIComponent(state.config.chave), {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(corpo),
      signal: controlador ? controlador.signal : undefined
    });
  }catch(erro){
    if(timer) clearTimeout(timer);
    if(erro && erro.name === "AbortError") throw new Error("TEMPO");
    throw new Error("REDE");
  }
  if(timer) clearTimeout(timer);
  if(!resposta.ok){
    let detalhe = "";
    try{ const j = await resposta.json(); detalhe = (j && j.error && j.error.message) ? String(j.error.message) : ""; }catch(e){}
    if(resposta.status === 400 && /api key not valid|invalid api key|api_key_invalid/i.test(detalhe)) throw new Error("CHAVE_INVALIDA");
    if(resposta.status === 401 || resposta.status === 403) throw new Error("CHAVE_SEM_PERMISSAO");
    if(resposta.status === 429) throw new Error("LIMITE");
    if(resposta.status === 404) throw new Error("MODELO_INEXISTENTE");
    if(resposta.status >= 500) throw new Error("SERVIDOR");
    throw new Error("HTTP_" + resposta.status + (detalhe ? "|" + detalhe.slice(0,150) : ""));
  }
  let dados;
  try{ dados = await resposta.json(); }catch(e){ throw new Error("RESPOSTA_ILEGIVEL"); }
  const candidato = dados && dados.candidates && dados.candidates[0];
  const partes = (candidato && candidato.content && candidato.content.parts) || [];
  const texto = partes.map(function(p){ return p.text || ""; }).join("").trim();
  if(!texto){
    const motivo = (candidato && candidato.finishReason) ? candidato.finishReason : "";
    throw new Error(motivo === "SAFETY" ? "BLOQUEADO" : "VAZIO");
  }
  return texto;
}
function mensagemDeErro(erro){
  const codigo = (erro && erro.message) ? erro.message : String(erro || "");
  const mensagens = {
    SEM_CHAVE:"A chave da IA não está configurada.",
    REDE:"Sem conexão com a IA.",
    TEMPO:"A IA demorou demais pra responder.",
    LIMITE:"Limite gratuito da IA atingido por agora.",
    CHAVE_INVALIDA:"Chave da IA inválida. Confira em Sobre.",
    CHAVE_SEM_PERMISSAO:"A chave não tem permissão pra este modelo.",
    MODELO_INEXISTENTE:"Este modelo da IA não existe mais. Use Testar conexão em Sobre.",
    SERVIDOR:"O serviço da IA está instável.",
    BLOQUEADO:"A IA recusou esse texto.",
    VAZIO:"A IA respondeu num formato inválido.",
    RESPOSTA_ILEGIVEL:"A IA respondeu num formato inválido.",
    GUARDRAIL:"A resposta da IA foi descartada por segurança."
  };
  return mensagens[codigo] || ("IA indisponível (" + codigo.slice(0, 60) + ").");
}
function extrairJSON(texto){
  let t = String(texto || "").trim();
  t = t.replace(/^```(?:json)?/i, "").replace(/```\s*$/, "").trim();
  const inicio = t.indexOf("{");
  const fim = t.lastIndexOf("}");
  if(inicio === -1 || fim === -1 || fim <= inicio) return null;
  const recorte = t.slice(inicio, fim + 1);
  try{ return JSON.parse(recorte); }
  catch(e){
    try{ return JSON.parse(recorte.replace(/,\s*([}\]])/g, "$1")); }   // vírgula sobrando antes de } ou ]
    catch(e2){ return null; }
  }
}
/** Valida a resposta da IA. Devolve {ok, lancamentos, problemas}. */
function validarSaidaIA(obj){
  if(!obj || typeof obj !== "object") return {ok:false, motivo:"resposta não é um objeto JSON", lancamentos:[]};
  let lista = null;
  if(Array.isArray(obj)) lista = obj;
  else if(Array.isArray(obj.lancamentos)) lista = obj.lancamentos;
  if(!lista) return {ok:false, motivo:"o JSON não tem a lista 'lancamentos'", lancamentos:[]};
  const limpos = [];
  const problemas = [];
  lista.slice(0, LIMITE_LANCAMENTOS).forEach(function(item, i){
    if(!item || typeof item !== "object"){ problemas.push("item " + (i + 1) + " não era um lançamento"); return; }
    const l = normalizarLancamento(item);
    const v = validarLancamento(l);
    if(!v.ok){ problemas.push("item " + (i + 1) + ": " + v.erros[0]); return; }
    limpos.push(l);
  });
  if(limpos.length === 0) return {ok:false, motivo:problemas.slice(0, 3).join("; ") || "nenhum lançamento válido", lancamentos:[]};
  return {ok:true, lancamentos:limpos, problemas:problemas};
}
/**
 * extrairLancamentos: texto livre → lançamentos estruturados.
 * 1) tenta IA; 2) se o JSON vier inválido, tenta 1 vez mais; 3) se falhar, usa as regras locais.
 * Nunca lança exceção: sempre devolve {lancamentos, fonte, aviso}.
 */
async function extrairLancamentos(texto){
  const limpo = String(texto || "").slice(0, LIMITE_TEXTO).trim();
  if(limpo.length < 3) return {lancamentos:[], fonte:"vazio", aviso:"Escreva pelo menos uma venda ou um gasto."};
  if(iaDisponivel()){
    let ultimoErro = null;
    for(let tentativa = 1; tentativa <= 2; tentativa++){
      try{
        const pedido = tentativa === 1
          ? 'Hoje é ' + hojeISO() + '.\nOrganize o texto abaixo:\n"""\n' + limpo + '\n"""'
          : 'Sua resposta anterior não foi um JSON válido no formato pedido.\nResponda SOMENTE o objeto JSON, sem nenhum texto antes ou depois.\nHoje é ' + hojeISO() + '.\nTexto:\n"""\n' + limpo + '\n"""';
        const bruto = await chamarGemini({instrucao:INSTRUCAO_EXTRACAO, prompt:pedido, json:true, temperatura:0, maxTokens:4096});
        const obj = extrairJSON(bruto);
        const validado = validarSaidaIA(obj);
        if(validado.ok){
          state.geradosIA++;
          return {lancamentos:validado.lancamentos, fonte:"ia",
                  aviso:(validado.problemas && validado.problemas.length) ? validado.problemas.length + " item(ns) incompleto(s) descartado(s)." : ""};

  }
  const local = extrairLancamentosPorRegras(limpo);

const VERBOS_ENTRADA = /(vendi|vende|vender|recebi|receb|recebo|entrou|entraram|ganhei|faturei|faturamento|fechei|sa[ií]ram|deu|rendeu|arrecadei|cobrei|peguei de cliente|pix das|pix de venda)/;

/** Números por extenso viram algarismos; "dúzia" vira 12. */
function numerosPorExtenso(texto){
  let t = String(texto || "");
  t = t.replace(/\bmeia\s+d[uú]zia\b/gi, "6");
  t = t.replace(/\bd[uú]zia\s+e\s+meia\b/gi, "18");
  const palavras = t.split(/\s+/);
  const saida = [];
  let i = 0;
  while(i < palavras.length){
    const limpa = normalizarTexto(palavras[i]).replace(/[^a-z]/g, "");
    const v1 = NUMEROS_SIMPLES[limpa];
    if(v1 === undefined){ saida.push(palavras[i]); i++; continue; }
    let total = v1;
    let j = i + 1;
    while(j < palavras.length){
      const prox = normalizarTexto(palavras[j]).replace(/[^a-z]/g, "");
      if(prox === "mil"){ total = total * 1000; j++; continue; }
      if(prox === "e"){
        const depois = j + 1 < palavras.length ? normalizarTexto(palavras[j + 1]).replace(/[^a-z]/g, "") : "";
        const v2 = NUMEROS_SIMPLES[depois];
        if(v2 === undefined) break;
        // "dois e cinquenta" = R$ 2,50 ; "vinte e cinco" = 25 ; "cento e cinquenta" = 150
        if(v1 <= 20 && v2 >= 10 && v2 % 10 === 0 && (v1 + v2) <= 100) total = v1 + (v2 / 100);
        else total = total + v2;
        j = j + 2;
        continue;
      }
      break;
    }
    saida.push(String(arredondar(total, 2)));
    i = j;
  }
  t = saida.join(" ");
  // "2 dúzia" → 24; precisa rodar depois da conversão dos números por extenso
  t = t.replace(/\b(\d+(?:[.,]\d+)?)\s*d[uú]zias?\b/gi, function(achado, n){ return String(arredondar((paraNumero(n) || 1) * 12)); });
  t = t.replace(/\bd[uú]zias?\b/gi, "12");
  return t;
}
function dataDaFrase(frase){
  const n = normalizarTexto(frase);
  const hoje = new Date();
  if(/\banteontem\b/.test(n)) return hojeISO(new Date(hoje.getTime() - 2 * 86400000));
  if(/\bontem\b/.test(n)) return hojeISO(new Date(hoje.getTime() - 86400000));
  let m = n.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
  if(m){
    const d = Number(m[1]), mm = Number(m[2]);
    let a = m[3] ? Number(m[3]) : hoje.getFullYear();
    if(a < 100) a += 2000;
    const iso = a + "-" + pad2(mm) + "-" + pad2(d);
    if(isoValido(iso)) return iso;
  }
  m = n.match(/\bdia\s+(\d{1,2})\b/);
  if(m){
    const d = Number(m[1]);
    if(d >= 1 && d <= 31){
      const iso = hoje.getFullYear() + "-" + pad2(hoje.getMonth() + 1) + "-" + pad2(d);
      if(isoValido(iso)) return iso;
    }
  }
  return hojeISO(hoje);
}
/** Quebra o texto em frases: linhas, pontos, vírgula antes de verbo e "e" antes de verbo ou de número. */
function separarFrases(texto){
  const limpo = String(texto || "").replace(/\r/g, "");
  const corte = /(?:[;\n\u2022]+)|(?:[.!?]+\s+)|(?:,\s*(?=(?:vendi|vende|vender|recebi|receb|gastei|gasto|comprei|paguei|fiz|tirei|peguei|retirei|ganhei|entrou|saiu|custou|arrecadei|fechei)\b))|(?:\s+e\s+(?=(?:vendi|vende|gastei|gasto|comprei|paguei|recebi|ganhei|tirei|peguei|retirei|fiz|foi|custou|entrou|saiu)\b))|(?:\s+e\s+(?=\d))/i;
  return limpo.split(corte).map(function(s){ return s.trim(); }).filter(function(s){ return s.replace(/\s+/g, "").length > 1; });
}
/** Procura um produto conhecido no texto (no maior nome possível). */
function acharProdutoConhecido(fraseNormalizada){
  for(let i = 0; i < PRODUTOS_NORMALIZADOS.length; i++){
    const item = PRODUTOS_NORMALIZADOS[i];
    if(new RegExp("\\b" + item.normalizado.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(fraseNormalizada)){
      return capitalizar(item.original);
    }
  }
  return "";
}
/** Último recurso: pega o nome que vem logo depois da quantidade ("vendi 3 colares de miçanga"). */
function produtoDepoisDaQuantidade(n){
  const m = n.match(/\b\d+(?:[.,]\d+)?\s+(?:unidades?\s+de\s+)?([a-z]+(?:\s+[a-z]+){0,3})/);
  if(!m) return "";
  let bruto = m[1].split(/\s+(?:de|do|da|dos|das|com|em|no|na|por|para|pra|pro|ao|a|e)\s+/)[0];
  bruto = bruto.replace(/\b(cada|reais|real|conto|contos|pila|pix|unidade|unidades|total)\b/g, " ").replace(/\s+/g, " ").trim();
  if(bruto.length < 3) return "";
  return capitalizar(bruto.split(" ").slice(0, 3).join(" "));
}
function detectarCategoria(fraseNormalizada, tipo){
  if(tipo === "entrada") return "venda";
  if(tipo === "retirada") return "outro";
  for(let i = 0; i < CATEGORIA_REGRAS.length; i++){
    if(CATEGORIA_REGRAS[i].re.test(fraseNormalizada)) return CATEGORIA_REGRAS[i].categoria;
  }
  return "outro";
}
function detectarTipo(fraseNormalizada){
  if(VERBOS_RETIRADA.test(fraseNormalizada)) return "retirada";
  if(VERBOS_SAIDA.test(fraseNormalizada)) return "saida";
  if(VERBOS_ENTRADA.test(fraseNormalizada)) return "entrada";
  return "";
}
/** Acha os números da frase e classifica cada um: dinheiro, total, cada, unidade, por. */
function coletarNumeros(frase){
  const achados = [];
  const crus = [];
  function varrer(re, tipo){
    re.lastIndex = 0;
    let m;
    while((m = re.exec(frase)) !== null){
      const numero = paraNumero(m[1]);
      if(numero !== null){
        const deslocamento = m[0].indexOf(m[1]);         // posição do número, não do início do match
        achados.push({numero:numero, pos:m.index + deslocamento, tipo:tipo});
      }
      if(m.index === re.lastIndex) re.lastIndex++;
    }
  }
  varrer(new RegExp(RE_MOEDA_ANTES.source, "gi"), "dinheiro");
  varrer(new RegExp(RE_MOEDA_DEPOIS.source, "gi"), "dinheiro");
  varrer(new RegExp(RE_CADA.source, "gi"), "cada");
  varrer(new RegExp(RE_A_UNIDADE.source, "gi"), "unidade");
  varrer(new RegExp(RE_POR.source, "gi"), "por");
  varrer(new RegExp(RE_TOTAL_MARCADO.source, "gi"), "total");
  RE_NUMERO_CRU.lastIndex = 0;
  let m;
  while((m = RE_NUMERO_CRU.exec(frase)) !== null){
    const numero = paraNumero(m[1]);
    if(numero !== null){
      const jaTem = achados.some(function(a){ return Math.abs(a.pos - m.index) < 2 && Math.abs(a.numero - numero) < 0.001; });
      if(!jaTem) crus.push({numero:numero, pos:m.index, tipo:"cru"});
    }
    if(m.index === RE_NUMERO_CRU.lastIndex) RE_NUMERO_CRU.lastIndex++;
  }
  return {achados:achados.sort(function(a, b){ return a.pos - b.pos; }), crus:crus};
}
/**
 * Interpreta UMA frase e devolve 0 ou 1 lançamento.
 * Se tipoHerdado vier preenchido (frase que continua a anterior, tipo "e 40 na feira"), o palpite é marcado como "confira".
 */
function interpretarFrase(frase, tipoHerdado){
  const comNumeros = numerosPorExtenso(frase);
  const n = normalizarTexto(comNumeros);
  const tipoDetectado = detectarTipo(n);
  const tipo = tipoDetectado || tipoHerdado || "";
  if(!tipo) return null;
  const valores = coletarNumeros(comNumeros);
  const marcados = valores.achados;
  const crus = valores.crus;
  if(marcados.length === 0 && crus.length === 0) return null;
  let revisar = !tipoDetectado;

  const posPrimeiroMarcado = marcados.length ? marcados[0].pos : Infinity;
  const qtdCandidatos = crus.filter(function(v){
    return v.pos < posPrimeiroMarcado && Number.isInteger(v.numero) && v.numero > 0 && v.numero <= 100000;
  });
  const primeiraQtd = qtdCandidatos.length ? qtdCandidatos[0] : null;
  let quantidade = primeiraQtd ? primeiraQtd.numero : null;
  const crusSobrando = crus.filter(function(v){ return v !== primeiraQtd; });

  const pegar = function(alvo){
    const lista = marcados.filter(function(v){ return v.tipo === alvo; });
    return lista.length ? lista[lista.length - 1].numero : null;
  };
  const unidadeValor = pegar("unidade");
  const cadaValor = pegar("cada");
  const totalMarcado = pegar("total");
  const porValor = pegar("por");
  const dinheiro = marcados.filter(function(v){ return v.tipo === "dinheiro"; });
  const unitarioMarcado = (cadaValor !== null) ? cadaValor : unidadeValor;

  let valorUnitario = null;
  let valorTotal = null;

  if(totalMarcado !== null){
    valorTotal = totalMarcado;                               // "deu 60", "gastei 25", "R$ 40 no total"
  } else if(unitarioMarcado !== null){
    valorUnitario = unitarioMarcado;                         // "a 3 conto", "2,50 cada"
  } else if(porValor !== null){
    valorTotal = porValor;                                   // "vendeu por 30"
    if(quantidade !== null && quantidade > 1) revisar = true;
  } else if(dinheiro.length === 1){
    if(quantidade === null) valorTotal = dinheiro[0].numero;
    else { valorUnitario = dinheiro[0].numero; revisar = true; }
  } else if(dinheiro.length > 1){
    valorTotal = arredondar(soma(dinheiro.map(function(v){ return v.numero; })));
    revisar = true;
  } else if(quantidade !== null && crusSobrando.length){
    valorTotal = crusSobrando[crusSobrando.length - 1].numero;   // "vendi 40 brigadeiro, deu de 100"
    revisar = true;
  } else if(quantidade !== null){
    valorTotal = quantidade;                                    // só havia um número: provavelmente é o valor
    quantidade = null;
    revisar = true;
  } else if(crus.length){
    valorTotal = crus[crus.length - 1].numero;
    revisar = true;
  }
  if(valorUnitario !== null && valorTotal === null){
    if(quantidade === null) quantidade = 1;
    valorTotal = arredondar(quantidade * valorUnitario);
  }
  if(valorUnitario === null && valorTotal !== null && quantidade !== null && quantidade > 1){
    const derivado = arredondar(valorTotal / quantidade);
    if(derivado > 0){ valorUnitario = derivado; revisar = true;}
  }
  if(valorTotal === null || valorTotal <= 0) return null;

  // Produto: na venda é o que ela vendeu; no gasto só quando o gasto cita o produto (senão entra no rateio).
  let produto = "";
  if(tipo === "entrada"){
    produto = acharProdutoConhecido(n) || produtoDepoisDaQuantidade(n);
    if(!produto) revisar = true;
  } else if(tipo === "saida"){
    produto = /(?:\bpro\b|\bpra\b|\bpara\b)/.test(n) ? acharProdutoConhecido(n) : "";
  }

  return normalizarLancamento({
    data:dataDaFrase(comNumeros),
    tipo:tipo,
    produto:produto,
    quantidade:quantidade,
    valor_unitario:valorUnitario,
    valor_total:valorTotal,
    categoria:detectarCategoria(n, tipo),
    origem_texto:frase.trim().slice(0, 200),
    revisar:revisar
  });
}
/** Extrator por regras: devolve sempre um array (mesmo vazio). */
function extrairLancamentosPorRegras(texto){
  const frases = separarFrases(texto);
  const lancamentos = [];
  let tipoAnterior = "";
  frases.forEach(function(frase){
    try{
      const l = interpretarFrase(frase, null);
      if(l && l.valor_total > 0){
        lancamentos.push(l);
        tipoAnterior = l.tipo;
      } else if(tipoAnterior){
        // Frase sem verbo ("... e 40 na feira") herda o tipo da anterior e fica marcada pra conferir.
        const herdeiro = interpretarFrase(frase, tipoAnterior);
        if(herdeiro && herdeiro.valor_total > 0){
          herdeiro.revisar = true;
          lancamentos.push(herdeiro);
        }
      }
    }catch(e){ /* uma frase malformada não interrompe as outras */ }
  });
  if(lancamentos.length === 0){
    // Último recurso: o primeiro número vira um lançamento marcado pra conferir.
    const comNumeros = numerosPorExtenso(texto);
    const n = normalizarTexto(comNumeros);
    const m = comNumeros.match(new RegExp("(" + NUMERO_BR + ")"));
    if(m){
      const valor = paraNumero(m[1]);
      const tipo = detectarTipo(n) || "entrada";
      if(valor !== null && valor > 0){
        lancamentos.push(normalizarLancamento({
          data:dataDaFrase(comNumeros), tipo:tipo, produto:acharProdutoConhecido(n),
          quantidade:null, valor_unitario:null, valor_total:valor,
          categoria:detectarCategoria(n, tipo), origem_texto:texto.trim().slice(0, 200), revisar:true
        }));
      }
    }
  }
  return lancamentos;
}

// Sistema de ações (delegação de eventos: funciona após qualquer re-render)
const ACOES = {};
function registrarAcao(nome, funcao){ ACOES[nome] = funcao; }
document.addEventListener("click", function(ev){
  const alvo = ev.target.closest("[data-acao]");
  if(!alvo) return;
  const nome = alvo.getAttribute("data-acao");
  if(ACOES[nome]){
    ev.preventDefault();
    try{ ACOES[nome](alvo, ev); }
    catch(erro){
      console.error(erro);
      toast("Algo deu errado por aqui: " + (erro && erro.message ? erro.message : "erro") , "erro");
    }
  }
});

  if(!campo) return;
  const contexto = campo.getAttribute("data-contexto") || "";
  const nome = campo.getAttribute("data-campo");
  const id = campo.getAttribute("data-id") || "";
  try{
    if(contexto === "rascunho") aplicarMudancaRascunho(id, nome, campo);
    else if(contexto === "edicao") aplicarMudancaEdicao(nome, campo);
    else if(contexto === "config") aplicarMudancaConfig(nome, campo);
    else if(contexto === "filtro") aplicarMudancaFiltro(nome, campo);
    else if(contexto === "preco") aplicarMudancaPrecoForm(nome, campo);
    else if(contexto === "piloto") aplicarMudancaPiloto(nome, campo);
  }catch(erro){
    console.error(erro);
    toast("Não consegui aplicar essa mudança. Tente de novo.", "erro");
  }
});
document.addEventListener("input", function(ev){
  const campo = ev.target.closest("[data-campo]");
  if(!campo) return;
  const contexto = campo.getAttribute("data-contexto") || "";
  const id = campo.getAttribute("data-id") || "";
  if(contexto === "rascunho"){
    const item = state.rascunho.filter(function(l){ return l.id === id; })[0];
    if(!item) return;
    const nome = campo.getAttribute("data-campo");
    if(nome === "quantidade") item.quantidade = paraNumero(campo.value);

    else if(nome === "valor_total") item.valor_total = paraNumero(campo.value);

  const caixa = document.getElementById("toasts");

  el.className = "toast toast-" + (tipo === "erro" ? "erro" : (tipo === "ok" ? "ok" : "info"));

function calcularTotalLinha(item){
  const q = paraNumero(item.quantidade);
  const u = paraNumero(item.valor_unitario);
  if(q !== null && u !== null && q > 0 && u > 0) return arredondar(q * u);
  const t = paraNumero(item.valor_total);
  if(t !== null) return arredondar(t);
  if(u !== null) return arredondar(u);
  return null;
}
function tabelaRascunho(){
  const tipos = [{v:"entrada", r:"Entrou (venda)"}, {v:"saida", r:"Saiu (gasto)"}, {v:"retirada", r:"Retirada pra mim"}];
  const categorias = CATEGORIAS.map(function(c){ return {v:c.valor, r:c.rotulo}; });
  let linhas = "";
  state.rascunho.forEach(function(item, i){
    const total = calcularTotalLinha(item);
    const semValor = !(total !== null && total > 0);
    const classe = (item.revisar || semValor) ? "tem-confira" : "";
    linhas += '<tr class="' + classe + '">' +
      '<td data-r="Item">' + (i + 1) +

        (semValor ? ' <span class="selo selo-saida">falta valor</span>' : '') + '</td>' +

      '<td data-r="Tipo"><select data-contexto="rascunho" data-id="' + item.id + '" data-campo="tipo" aria-label="Tipo do item ' + (i + 1) + '">' + opcoes(tipos, item.tipo) + '</select></td>' +
      '<td data-r="Produto"><input type="text" data-contexto="rascunho" data-id="' + item.id + '" data-campo="produto" value="' + esc(item.produto) + '" placeholder="ex.: Brigadeiro" aria-label="Produto do item ' + (i + 1) + '"></td>' +
      '<td data-r="Quantidade"><input type="text" inputmode="decimal" data-contexto="rascunho" data-id="' + item.id + '" data-campo="quantidade" value="' + esc(item.quantidade === null || item.quantidade === undefined ? "" : item.quantidade) + '" placeholder="—" aria-label="Quantidade do item ' + (i + 1) + '"></td>' +
      '<td data-r="Valor unitário"><input type="text" inputmode="decimal" data-contexto="rascunho" data-id="' + item.id + '" data-campo="valor_unitario" value="' + esc(item.valor_unitario === null || item.valor_unitario === undefined ? "" : item.valor_unitario) + '" placeholder="—" aria-label="Valor unitário do item ' + (i + 1) + '"></td>' +
      '<td data-r="Valor total"><input type="text" inputmode="decimal" data-contexto="rascunho" data-id="' + item.id + '" data-campo="valor_total" value="' + esc(item.valor_total === null || item.valor_total === undefined ? "" : item.valor_total) + '" placeholder="0,00" aria-label="Valor total do item ' + (i + 1) + '"></td>' +
      '<td data-r="Categoria"><select data-contexto="rascunho" data-id="' + item.id + '" data-campo="categoria" aria-label="Categoria do item ' + (i + 1) + '">' + opcoes(categorias, item.categoria) + '</select></td>' +

          ? '<label class="linha-check" style="justify-content:flex-end"><input type="checkbox" data-contexto="rascunho" data-id="' + item.id + '" data-campo="conferido" aria-label="Marcar item ' + (i + 1) + ' como conferido"><span>ok</span></label>'
          : '<span class="texto-suave">—</span>') + '</td>' +

    '</tr>';
  });
  return '<table class="tabela responsiva"><thead><tr>' +
    '<th>#</th><th>Data</th><th>Tipo</th><th>Produto</th><th>Qtd</th><th>Unitário</th><th>Total</th><th>Categoria</th><th>Total</th><th>Conferido</th><th></th>' +
    '</tr></thead><tbody>' + linhas + '</tbody></table>';
}
function resumoRascunho(){
  let entra = 0, sai = 0, retira = 0, problemas = 0;
  state.rascunho.forEach(function(item){
    const total = calcularTotalLinha(item);
    if(!(total !== null && total > 0)){ problemas++; return; }
    if(item.tipo === "entrada") entra += total;
    else if(item.tipo === "saida") sai += total;
    else retira += total;
  });
  return '<div class="grade grade-3">' +
      '<div class="kpi kpi-neutro"><span>Entra</span><strong class="num" style="font-size:1.1rem">' + fmtBRL(entra) + '</strong></div>' +
      '<div class="kpi kpi-neutro"><span>Sai</span><strong class="num" style="font-size:1.1rem">' + fmtBRL(sai) + '</strong></div>' +
      '<div class="kpi kpi-neutro"><span>Retirada</span><strong class="num" style="font-size:1.1rem">' + fmtBRL(retira) + '</strong></div>' +
    '</div>' +
    (problemas ? '<div class="aviso aviso-atencao" style="margin-top:10px"><b>' + problemas + ' item(ns) sem valor</b>Preencha o valor total pra poder salvar (ou apague a linha).</div>' : '');
}
function atualizarResumoRascunho(){
  const el = document.getElementById("resumoRascunho");
  if(el) el.innerHTML = resumoRascunho();
}
function aplicarMudancaRascunho(id, campo, elemento){
  const item = state.rascunho.filter(function(l){ return l.id === id; })[0];
  if(!item) return;
  if(campo === "data"){ item.data = isoValido(elemento.value) || item.data; }
  else if(campo === "tipo"){ item.tipo = elemento.value; if(item.tipo === "entrada") item.categoria = "venda"; }
  else if(campo === "produto"){ item.produto = elemento.value; }
  else if(campo === "categoria"){ item.categoria = elemento.value; }
  else if(campo === "quantidade"){ item.quantidade = paraNumero(elemento.value); }
  else if(campo === "valor_unitario"){ item.valor_unitario = paraNumero(elemento.value); }
  else if(campo === "valor_total"){ item.valor_total = paraNumero(elemento.value); }
  else if(campo === "conferido"){ if(elemento.checked) item.revisar = false; else item.revisar = true; }
  // Total editado tem prioridade; senão vale quantidade × unitário.
  const normalizado = normalizarLancamento(Object.assign({}, item, {id:item.id}), {respeitarTotal:(campo === "valor_total")});
  state.rascunho = state.rascunho.map(function(l){ return l.id === id ? normalizado : l; });
  renderRegistrar();
}

async function gerarDiagnostico(){
  const mes = mesDeReferencia();
  const doMes = filtrarPorMes(state.lancamentos, mes);
  if(doMes.length === 0){
    toast("Registre pelo menos uma venda ou um gasto antes de gerar o diagnóstico.", "erro");
    return;
  }
  const totais = calcularTotais(doMes);
  const produtos = calcularPorProduto(doMes);
  state.carregandoDiag = true;
  state.avisoDiag = "";
  renderDiagnostico();
  let resultado = null;
  let aviso = "";
  if(iaDisponivel()){
    try{
      resultado = await gerarDiagnosticoIA(montarResumoAgregado(totais, produtos, mes));
      state.geradosIA++;
    }catch(erro){
      resultado = gerarDiagnosticoLocal({totais:totais, produtos:produtos, mes:mes});
      aviso = mensagemDeErro(erro) + " Diagnóstico feito pelas regras do app.";
    }
  } else {
    resultado = gerarDiagnosticoLocal({totais:totais, produtos:produtos, mes:mes});
    aviso = "";   // o cartão do Diagnóstico já avisa que está sem IA
  }
  state.resultadoDiagnostico = resultado;
  state.avisoDiag = aviso;
  state.carregandoDiag = false;
  renderTela(telaAtual);
}

function formularioPiloto(fase){
  const perguntas = fase === "antes" ? PERGUNTAS_ANTES : PERGUNTAS_DEPOIS;
  const respostas = fase === "antes" ? state.respostaAntes : state.respostaDepois;
  return perguntas.map(function(p){

    if(p.tipo === "nota"){

          '<option value="">Escolha de 0 a 10…</option>' +
          Array.from({length:11}, function(_, n){ return n; }).map(function(n){
            return '<option value="' + n + '"' + (String(valor) === String(n) ? ' selected' : '') + '>' + n + (n === 0 ? " (nenhuma)" : (n === 10 ? " (total)" : "")) + '</option>';
          }).join("") +
        '</select></div>';
    }
    return '<div class="campo"><label for="pil_' + fase + '_' + p.id + '">' + esc(p.texto) + '</label>' +
      '<select id="pil_' + fase + '_' + p.id + '" data-contexto="piloto" data-campo="' + fase + '|' + p.id + '">' +

        p.opcoes.map(function(o, i){ return '<option value="' + i + '"' + (String(valor) === String(i) ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join("") +
      '</select></div>';
  }).join("");
}
function impactoPiloto(){
  const antes = state.participantes.filter(function(p){ return p.fase === "antes"; });
  const depois = state.participantes.filter(function(p){ return p.fase === "depois"; });
  const media = function(lista, campo){
    const vals = lista.map(function(p){ return Number((p.respostas || {})[campo]); }).filter(function(v){ return isFinite(v); });
    return vals.length ? arredondar(soma(vals) / vals.length, 1) : null;
  };
  const pct = function(lista, campo, minimo){
    const vals = lista.map(function(p){ return Number((p.respostas || {})[campo]); }).filter(function(v){ return isFinite(v); });
    if(!vals.length) return null;
    return arredondar((vals.filter(function(v){ return v >= minimo; }).length / vals.length) * 100, 0);
  };
  return {
    totalAntes:antes.length,
    totalDepois:depois.length,
    sabiaLucroAntes:pct(antes, "sabia_lucro", 2),
    sabiaLucroDepois:pct(depois, "sabia_lucro", 2),
    sabiaCustoAntes:pct(antes, "sabia_custo", 2),
    sabiaCustoDepois:pct(depois, "sabia_custo", 2),
    anotavaAntes:pct(antes, "anotava", 2),
    anotavaDepois:pct(depois, "anotava", 2),
    confiancaAntes:media(antes, "confianca"),
    confiancaDepois:media(depois, "confianca")
  };
}

// Organizar texto (IA com fallback)
async function organizarTexto(){
  const area = document.getElementById("textoRegistrar");
  const texto = area ? area.value : (state.textoRegistrar || "");
  state.textoRegistrar = texto;
  if(texto.trim().length < 3){ toast("Escreva primeiro o que você vendeu ou gastou.", "erro"); return; }
  state.carregando = true;
  state.avisoRegistrar = null;
  renderRegistrar();
  let resultado;
  try{
    resultado = await extrairLancamentos(texto);
  }catch(erro){
    console.error(erro);
    resultado = {lancamentos:extrairLancamentosPorRegras(texto), fonte:"regras",
                 aviso:"A leitura com IA falhou. Usei as regras do app."};
  }
  state.carregando = false;
  if(resultado.lancamentos && resultado.lancamentos.length){
    state.rascunho = state.rascunho.concat(resultado.lancamentos).slice(0, 200);
    const fonte = resultado.fonte === "ia" ? "Com a IA" : "Com as regras do app";
    state.avisoRegistrar = {tipo: resultado.fonte === "ia" ? "bom" : "info",
      titulo: fonte + ": " + resultado.lancamentos.length + " lançamento(s) encontrados",
      texto: esc(resultado.aviso || "Confira os valores e toque em salvar.")};
    toast(fonte + ": " + resultado.lancamentos.length + " lançamento(s). Confira antes de salvar.", "ok");
  } else {
    state.avisoRegistrar = {tipo:"atencao", titulo:"Não achei nenhum valor nesse texto",
      texto: esc(resultado.aviso || "Tente algo como: vendi 12 brigadeiro a 3 conto e gastei 25 no mercado com leite condensado.")};
    toast("Nenhum valor encontrado.", "erro");
  }
  renderRegistrar();
  const resumo = document.getElementById("resumoRascunho");
  if(resumo && resumo.scrollIntoView) resumo.scrollIntoView({block:"center", behavior:"smooth"});
}
function salvarRascunho(){
  if(!state.rascunho.length){ toast("Não tem nada pra salvar.", "erro"); return; }
  const validos = [];
  let semValor = 0;
  let comDuvida = 0;
  state.rascunho.forEach(function(item){
    const l = normalizarLancamento(item);
    if(l.valor_total > 0){
      validos.push(l);
      if(l.revisar) comDuvida++;
    } else {
      semValor++;
    }
  });
  if(validos.length === 0){
    toast("Nenhum item tem valor preenchido. Coloque o valor total antes de salvar.", "erro");
    return;
  }
  state.lancamentos = state.lancamentos.concat(validos).slice(0, LIMITE_LANCAMENTOS);
  const gravou = salvarEstado();
  state.rascunho = [];
  state.textoRegistrar = "";
  state.avisoRegistrar = null;
  state.mesCaixa = mesDeDataISO(validos[0].data) || mesAtualISO();
  if(validos.length > 0 && mesDeDataISO(validos[validos.length - 1].data) > state.mesCaixa) state.mesCaixa = mesDeDataISO(validos[validos.length - 1].data);
  toast(validos.length + " lançamento(s) salvo(s)." +
    (semValor ? " " + semValor + " item(ns) sem valor ficaram de fora." : "") +
    (comDuvida ? " " + comDuvida + " ainda marcado(s) pra conferir." : ""), "ok");
  if(!gravou) toast("O navegador está bloqueando o salvamento. Exporte um backup.", "erro");
  irPara("caixa");
}
// Editar e excluir lançamento
function formularioLancamento(l){
  const tipos = [{v:"entrada", r:"Entrou (venda)"}, {v:"saida", r:"Saiu (gasto)"}, {v:"retirada", r:"Retirada pra mim"}];
  const categorias = CATEGORIAS.map(function(c){ return {v:c.valor, r:c.rotulo}; });
  return '<div class="grade-campos">' +
      '<div class="campo"><label for="ed_data">Data</label><input id="ed_data" type="date" data-contexto="edicao" data-campo="data" value="' + esc(l.data) + '"></div>' +
      '<div class="campo"><label for="ed_tipo">Tipo</label><select id="ed_tipo" data-contexto="edicao" data-campo="tipo">' + opcoes(tipos, l.tipo) + '</select></div>' +
    '</div>' +

// Mudanças de campos (config, filtro, preço, piloto)
function aplicarMudancaEdicao(campo, elemento){
  // Se o último campo alterado foi o total, ele tem prioridade ao salvar.
  state.ultimoCampoEdicao = campo;
}
function aplicarMudancaConfig(campo, elemento){
  if(campo === "lembrar"){
    state.config.lembrar = !!elemento.checked;
    if(state.config.lembrar === false) state.config.soLocal = false;
    salvarChave();
    salvarConfiguracoes();
  } else if(campo === "usarIA"){
    state.config.usarIA = !!elemento.checked;
    salvarConfiguracoes();
  } else if(campo === "soLocal"){
    state.config.soLocal = !!elemento.checked;
    if(state.config.soLocal){ state.config.lembrar = false; salvarChave(); }
    salvarConfiguracoes();
  } else if(campo === "nomeUsuario"){
    state.config.nomeUsuario = String(elemento.value || "").slice(0, 40);
    salvarConfiguracoes();
    return; // sem re-render a cada tecla
  }
  renderSobre();
}
function aplicarMudancaFiltro(campo, elemento){
  if(campo === "mesCaixa" && isoValido(elemento.value + "-01")){
    state.mesCaixa = elemento.value;
    renderTela(telaAtual);
  }
}
function aplicarMudancaPrecoForm(campo, elemento){
  if(!state.formPreco) formPrecoInicial();
  state.formPreco[campo] = elemento.value;
}
function aplicarMudancaPiloto(campo, elemento){
  if(campo === "nome"){
    state.nomePiloto = String(elemento.value || "").slice(0, 30);
    return;
  }
  const partes = String(campo).split("|");
  const fase = partes[0] === "depois" ? "depois" : "antes";
  const id = partes[1];
  if(!id) return;
  if(fase === "antes") state.respostaAntes[id] = elemento.value;
  else state.respostaDepois[id] = elemento.value;
  renderPiloto();
}
function salvarPiloto(){
  const fase = state.etapaPiloto === "depois" ? "depois" : "antes";
  const perguntas = fase === "antes" ? PERGUNTAS_ANTES : PERGUNTAS_DEPOIS;
  const respostas = fase === "antes" ? state.respostaAntes : state.respostaDepois;
  const faltando = perguntas.filter(function(p){ return respostas[p.id] === undefined || respostas[p.id] === ""; });
  if(faltando.length){ toast("Faltou responder: " + faltando[0].texto, "erro"); return; }
  const numericas = {};
  perguntas.forEach(function(p){ numericas[p.id] = Number(respostas[p.id]); });
  state.participantes.push({
    id: uid(),
    data: hojeISO(),
    fase: fase,
    nome: String(state.nomePiloto || "").trim().slice(0, 30),
    respostas: numericas,
    criadoEm: new Date().toISOString()
  });
  const gravou = salvarEstado();
  if(fase === "antes") state.respostaAntes = {}; else state.respostaDepois = {};
  state.nomePiloto = "";
  toast("Resposta salva. Total: " + state.participantes.length + ".", "ok");
  if(!gravou) toast("O navegador está bloqueando o salvamento. Exporte a planilha.", "erro");
  renderPiloto();
}
async function testarChave(){
  const campo = document.getElementById("cfgChave");

    salvarConfiguracoes();

  if(!temChave()){
    state.testeResultado = avisoHTML("atencao", "Sem chave", "Cole sua chave do Google AI Studio pra testar.");

  }
  state.testando = true;

    let dica = "Confira se a chave foi copiada inteira e está ativa no Google AI Studio.";

    if(r.motivo === "NENHUM_MODELO") dica = "Nenhum modelo respondeu. Crie uma chave nova no Google AI Studio.";
    state.testeResultado = avisoHTML("ruim", "Falha na conexão", motivos + "<br><br>" + esc(dica));
  }
  renderSobre();
}
// Importar arquivo
document.addEventListener("change", function(ev){
  const alvo = ev.target;
  if(!alvo || alvo.id !== "arquivoImportar" || !alvo.files || !alvo.files.length) return;
  const arquivo = alvo.files[0];
  const leitor = new FileReader();
  leitor.onload = function(){
    let obj = null;
    try{ obj = JSON.parse(String(leitor.result)); }
    catch(e){ obj = null; }
    if(!obj || (!Array.isArray(obj.lancamentos) && !Array.isArray(obj.participantes))){
      state.importAviso = avisoHTML("ruim", "Arquivo não reconhecido", "Escolha um arquivo JSON exportado pelo próprio Mangos.");
      renderSobre();
      return;
    }
    const lancamentos = (obj.lancamentos || []).map(normalizarLancamento).filter(function(l){ return l.valor_total > 0; });
    const participantes = (obj.participantes || []).filter(function(p){ return p && typeof p === "object" && p.respostas; });
    abrirModal("Importar backup", "<p>O arquivo tem <b>" + lancamentos.length + " lançamento(s)</b> e <b>" + participantes.length + " resposta(s) do piloto</b>.</p>" +
      "<p>Como você quer importar?</p>" +
      '<div class="linha-botoes"><button class="btn btn-primario" data-acao="importar-substituir" style="flex:1 1 100%">Substituir o que está aqui</button>' +
      '<button class="btn btn-secundario" data-acao="importar-somar" style="flex:1 1 100%">Somar aos meus dados</button>' +
      '<button class="btn btn-secundario" data-acao="fechar-modal" style="flex:1 1 100%">Cancelar</button></div>');
    state.importando = {lancamentos:lancamentos, participantes:participantes};
    alvo.value = "";
  };
  leitor.onerror = function(){
    state.importAviso = avisoHTML("ruim", "Não consegui ler o arquivo", "Tente novamente ou use outro backup.");
    renderSobre();
  };
  try{ leitor.readAsText(arquivo); }
  catch(e){
    state.importAviso = avisoHTML("ruim", "Não consegui ler o arquivo", "O navegador bloqueou a leitura. Copie o conteúdo do JSON e cole no app.");
    renderSobre();
  }
});
registrarAcao("importar-substituir", function(){

registrarAcao("importar-somar", function(){
  const pacote = state.importando;
  if(!pacote) return;
  const ids = {};
  state.lancamentos.forEach(function(l){ ids[l.id] = true; });
  const novos = pacote.lancamentos.filter(function(l){ return !ids[l.id]; });
  state.lancamentos = state.lancamentos.concat(novos).slice(0, LIMITE_LANCAMENTOS);
  const idsP = {};
  state.participantes.forEach(function(p){ idsP[p.id] = true; });
  state.participantes = state.participantes.concat(pacote.participantes.filter(function(p){ return !idsP[p.id]; }));
  const gravou = salvarEstado();
  fecharModal();
  state.importAviso = avisoHTML(gravou ? "bom" : "atencao", "Backup somado", "Adicionei " + novos.length + " lançamento(s) novo(s). Repetidos ignorados.");

function desenharGraficoProdutos(produtos){
  const canvas = document.getElementById("graficoProdutos");

  const lista = (produtos || []).filter(function(p){ return p.receita > 0 || p.custoAtribuido > 0; }).slice(0, 8);
  const rotulos = lista.map(function(p){ return p.produto.length > 18 ? p.produto.slice(0, 17) + "…" : p.produto; });
  const valores = lista.map(function(p){ return p.lucro; });
  const verde = corDaVariavel("--positivo", "#C6FF00");
  const vermelho = corDaVariavel("--negativo", "#FF7A6B");
  const texto = corDaVariavel("--text-secondary", "#A1A6A9");
  const grade = "rgba(247,247,247,.05)";
  try{
    if(graficoProdutos){ graficoProdutos.destroy(); graficoProdutos = null; }
    Chart.defaults.font.family = "'Sora', system-ui, sans-serif";
    graficoProdutos = new Chart(canvas.getContext("2d"), {
      type:"bar",
      data:{
        labels:rotulos,
        datasets:[{
          label:"Lucro no mês (R$)",
          data:valores,
          backgroundColor:valores.map(function(v){ return v < 0 ? vermelho : verde; }),
          borderRadius:6,
          maxBarThickness:28,
          borderSkipped:false
        }]
      },
      options:{
        indexAxis:"y",
        responsive:true,
        maintainAspectRatio:false,
        animation:{duration:400},
        plugins:{
          legend:{display:false},
          tooltip:{
            callbacks:{
              label:function(ctx){ return " " + fmtBRL(ctx.parsed.x); }
            }
          }
        },
        scales:{
          x:{grid:{color:grade}, ticks:{color:texto, callback:function(v){ return fmtBRL(v); }}},
          y:{grid:{display:false}, ticks:{color:texto, font:{weight:"700"}}}
        }
      }
    });
  }catch(erro){
    console.error(erro);
    if(aviso) aviso.classList.remove("oculto");
    canvas.style.display = "none";
  }
}

// ---- Exportação ----
function baixarArquivo(nome, blob){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    return true;
  }catch(e){
    toast("O navegador bloqueou o download. Abra o arquivo direto no navegador.", "erro");
    return false;
  }
}

  return hojeISO().split("-").reverse().join("-");
}

        }).join("\n");
      }).join("\n\n");
      baixarArquivo(nome.replace(/\.xlsx$/i, ".csv"), new Blob(["\ufeff" + partes], {type:"text/csv;charset=utf-8"}));
      toast("Sem conexão com a biblioteca de Excel: exportado em CSV.", "info");
    }catch(e){
      toast("Não consegui gerar a planilha neste navegador.", "erro");
    }
    return;
  }
  try{
    const wb = XLSX.utils.book_new();
    abas.forEach(function(aba){
      const ws = XLSX.utils.aoa_to_sheet(aba.dados);
      const larguras = [];
      aba.dados.forEach(function(linha){
        linha.forEach(function(celula, i){
          const tamanho = String(celula === null || celula === undefined ? "" : celula).length + 2;
          larguras[i] = Math.max(larguras[i] || 10, Math.min(40, tamanho));
        });
      });
      ws["!cols"] = larguras.map(function(l){ return {wch:l}; });
      XLSX.utils.book_append_sheet(wb, ws, aba.nome.slice(0, 30));
    });
    const dados = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    baixarArquivo(nome, new Blob([dados], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    toast(avisoSucesso || "Planilha exportada.", "ok");
  }catch(e){
    console.error(e);
    toast("Não consegui montar o Excel neste navegador. Tente exportar o backup em JSON.", "erro");
  }
}
